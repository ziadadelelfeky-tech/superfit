<html lang="ar" dir="rtl">

<style>
:root{
  --bg:#F2F3EF;--surface:#FFFFFF;--ink:#1B2228;--muted:#5C6870;--line:#D9DDD8;
  --plate:#C99700;--plate-soft:#FFF3C4;--iron:#2B3640;--ok:#2E7D4F;--warn:#B3401E;--warn-soft:#FBE3DA;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A1F;--surface:#1D252C;--ink:#E9EDEF;--muted:#9AA6AD;--line:#2E3942;
  --plate:#F2C230;--plate-soft:#3A3315;--iron:#E9EDEF;--ok:#5CC08A;--warn:#F08A64;--warn-soft:#3B2219;}}
:root[data-theme="dark"]{--bg:#141A1F;--surface:#1D252C;--ink:#E9EDEF;--muted:#9AA6AD;--line:#2E3942;
  --plate:#F2C230;--plate-soft:#3A3315;--iron:#E9EDEF;--ok:#5CC08A;--warn:#F08A64;--warn-soft:#3B2219;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alexandria","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:30px;font-weight:800;line-height:1.15;margin:6px 0}
h2{font-size:22px;margin:22px 0 8px;line-height:1.3}
h3{font-size:17px;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.flag{background:var(--warn-soft);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.hint{background:var(--plate-soft);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
button,input,select{font:inherit;color:inherit}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--iron);color:var(--bg)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--plate);color:#1B2228}
.btn.full{width:100%}
.btn:disabled{opacity:.4}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
label.f{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input[type=text],input[type=number],input[type=time],input[type=date],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.row{display:flex;gap:10px}.row>*{flex:1}
.choices{display:grid;gap:8px;margin-top:6px}
.choice{display:block;text-align:right;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.choice b{display:block}.choice span{font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--plate);background:var(--plate-soft)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--plate);flex:0 0 auto}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--plate)}
nav.bar{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.bar button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px}
nav.bar button .ic{display:block;font-size:20px;line-height:1.2}
nav.bar button[aria-current="true"]{color:var(--ink);background:var(--plate-soft)}
.hero{padding:6px 0 4px}
.hero .day{font-size:15px;color:var(--muted);font-weight:600}
.hero .what{font-size:34px;font-weight:800;line-height:1.1;margin:2px 0 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .n{font-size:22px;font-weight:800;direction:ltr}.stat .l{font-size:12px;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.fig{display:block;width:100%;max-width:220px;height:auto;margin:0 auto 8px;color:var(--ink);background:var(--bg);border-radius:10px}
.ex .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .ar{font-weight:700}.ex .en{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.ex .dose{font-weight:800;white-space:nowrap;direction:ltr}
.ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ex .links{display:flex;gap:8px;margin-top:8px}
.ex .links a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:7px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.sets{margin-top:10px;display:grid;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px;align-items:center}
.set .i{font-size:13px;color:var(--muted);text-align:center}
.set input{padding:8px;text-align:center;direction:ltr}
.set button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:800}
.set button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.last{font-size:12px;color:var(--muted);margin-top:4px}
.lvlbtns{display:flex;gap:8px;margin-top:8px}.lvlbtns button{flex:1;font-size:13px;padding:8px}
.block{border-right:4px solid var(--line);padding:2px 12px 2px 0;margin:16px 0 6px}
.block.main{border-right-color:var(--plate)}
.block h3{margin:0}.block p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .tm{font-weight:800;direction:ltr;text-align:right}
.tl li.gym{background:var(--plate-soft);border-radius:10px;padding:10px 8px}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro .stat .n{font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}th{font-size:13px;color:var(--muted);font-weight:600}
.cups{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cups button{width:38px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.cups button[aria-pressed="true"]{background:#3A8DDE;border-color:#3A8DDE}
.ladder{list-style:none;padding:0;margin:0}
.ladder li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ladder .lv{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--line)}
.ladder li.here .lv{background:var(--plate);border-color:var(--plate);color:#1B2228}
.ladder li.done .lv{border-color:var(--ok);color:var(--ok)}
.chart{width:100%;height:auto;display:block}
.timer{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;max-width:656px;margin:0 auto;
  background:var(--iron);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:10px}
.timer.on{display:flex}
.timer .n{font-size:28px;font-weight:800;direction:ltr}
.timer button{background:var(--plate);color:#1B2228;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.weekgrid{display:grid;gap:6px}
.weekgrid .d{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:right;width:100%}
.weekgrid .d[aria-current="true"]{border-color:var(--plate);background:var(--plate-soft)}
.weekgrid .d .k{font-weight:700}
.small{font-size:12px}
ul.plain{padding-right:20px;margin:6px 0}ul.plain li{margin:3px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

function nutrition(p){

  else{kcal=b>=28?tdee*0.85:tdee*1.03;why=b>=28?"عجز بسيط مع تمرين القوة.":"على قد احتياجك وزيادة صغيرة للأداء.";}
  const floor=Math.max(bmr,male?1500:1200);if(kcal<floor){kcal=floor;}

function mealSlots(p,train){
  const sp=sleepPlan(p),n=nutrition(p),wake=sp.wake,awake=1440-sp.need*60,last=awake-120;
  const rel=t=>((t-wake)%1440+1440)%1440;
  const slots=[];
  if(train){const g=rel(toMin(p.gymTime)||1200),end=g+(p.session||60);
    if(g<150){if(g>=60)slots.push({r:Math.max(15,g-75),k:"pre"});slots.push({r:end+30,k:"post"});}
    else{slots.push({r:30,k:"breakfast"});slots.push({r:g-75,k:"pre"});slots.push({r:end+30,k:"post"});}
  }else slots.push({r:30,k:"breakfast"});
  let left=n.meals-slots.length,dinnerPlaced=false;
  while(left-->0){
    const pts=slots.map(x=>x.r).sort((a,b)=>a-b);let best=-1,bi=0;
    for(let i=0;i<pts.length;i++){const nx=i+1<pts.length?pts[i+1]:last+90;const gap=nx-pts[i];if(gap>best){best=gap;bi=i;}}
    const a=pts[bi],b=bi+1<pts.length?pts[bi+1]:null;
    if(b===null&&!dinnerPlaced&&last-a>=150){slots.push({r:last,k:"dinner"});dinnerPlaced=true;}
    else slots.push({r:Math.round((a+(b===null?last:b))/2),k:"mid"});
  }
  slots.sort((a,b)=>a.r-b.r);
  const mids=slots.filter(x=>x.k==="mid");
  if(mids.length){let li=mids[0],bd=1e9;mids.forEach(m=>{const d=Math.abs(((wake+m.r)%1440)-900);if(d<bd){bd=d;li=m;}});
    if(!slots.some(x=>x.k==="lunch"))li.k="lunch";
    mids.forEach(m=>{if(m.k==="mid")m.k=(!dinnerPlaced&&!train&&m===mids[mids.length-1]&&m!==li)?"dinner":"snack";});}
  return slots.map(x=>({t:(wake+x.r)%1440,k:x.k}));
}
function pickPool(type,p){
  const no=p.noFood||[],hf=p.health||[];
  let pool=MT[type].filter(m=>!m.t.some(t=>no.includes(t))&&!(m.ex||[]).some(f=>hf.includes(f)));
  if(!pool.length)pool=MT[type].filter(m=>!(m.ex||[]).some(f=>hf.includes(f)));
  return pool.length?pool:MT[type];
}
function buildMeal(m,T){
  const mac=(k,g)=>[FD[k][1]*g/100,FD[k][2]*g/100,FD[k][3]*g/100];
  const fx=(m.fx||[]).map(x=>[x[0],x[1]]);const base=[0,0,0];fx.forEach(x=>{const a=mac(x[0],x[1]);base[0]+=a[0];base[1]+=a[1];base[2]+=a[2];});
  const P=FD[m.P],C=FD[m.C];let pg=Math.max(0,(T[0]-base[0])/(P[1]/100)),cg=0;
  for(let it=0;it<3;it++){cg=C[2]>0?Math.max(0,(T[1]-base[1]-pg*P[2]/100)/(C[2]/100)):0;pg=Math.max(0,(T[0]-base[0]-cg*C[1]/100)/(P[1]/100));}
  pg=Math.min(pg,P[6]);cg=Math.min(cg,C[6]);
  let fg=0;if(m.F){const F=FD[m.F];fg=Math.max(0,(T[2]-base[2]-pg*P[3]/100-cg*C[3]/100)/(F[3]/100));fg=Math.min(fg,F[6]);}
  const items=[];const add=(k,g)=>{if(g<=0)return;const f=FD[k];
    let q,lbl,ug=f[5];
    if(f[4]==="g"||f[4]==="ml"){g=g<60?Math.round(g/5)*5:Math.round(g/10)*10;lbl=g+(f[4]==="ml"?" مل ":" جم ")+f[0];}
    else{const step=(f[4]==="egg"||f[4]==="white")?1:0.5;q=Math.max(step,Math.round(g/ug/step)*step);g=q*ug;
      const u={egg:"بيضة",white:"بياض",loaf:"رغيف",slice:"شريحة",scoop:"سكوب",piece:"حباية",tsp:"معلقة صغيرة",tbsp:"معلقة كبيرة"}[f[4]];
      const qs=q===0.5?"نص":q===1.5?"واحد ونص":String(q);
      lbl=(f[4]==="egg"||f[4]==="white")?`${q} ${f[4]==="egg"?"بيض كامل":"بياض بيض"}`:`${qs} ${u} ${f[0]}`;}
    if(g<5)return;items.push([lbl,mac(k,g)]);};
  add(m.P,pg);fx.forEach(x=>add(x[0],x[1]));add(m.C,cg);if(m.F)add(m.F,fg);
  const tot=items.reduce((a,x)=>[a[0]+x[1][0],a[1]+x[1][1],a[2]+x[1][2]],[0,0,0]);
  (m.fr||[]).forEach(k=>items.push([FD[k][0]+" (براحتك)",[0,0,0]]));
  return{items:items.map(x=>x[0]),p:Math.round(tot[0]),c:Math.round(tot[1]),f:Math.round(tot[2]),kcal:Math.round(tot[0]*4+tot[1]*4+tot[2]*9)};
}
function dayMeals(p,train){
  const n=nutrition(p),sl=mealSlots(p,train);
  const sw=[0,1,2].map(i=>sl.reduce((a,x)=>a+MW[x.k][i],0));
  const tot=[n.prot,n.carb,n.fat];const doy=Math.floor(Date.now()/864e5);
  return sl.map((x,i)=>{const T=[0,1,2].map(j=>tot[j]*MW[x.k][j]/sw[j]);
    const pool=pickPool(x.k,p);const key=todayKey()+(train?"T":"R")+i;
    const idx=(doy+i*3+((S.mealPick||{})[key]||0))%pool.length;
    return Object.assign({t:x.t,k:x.k,key,name:pool[idx].n,many:pool.length>1},buildMeal(pool[idx],T));});
}

  bar.querySelectorAll("button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view));
  app.innerHTML=({today:vToday,week:vWeek,food:vFood,life:vLife,me:vMe}[view])();
  bindView();
}

/* ---------- onboarding ---------- */

  if(obStep===8)body=`<h2>أكلك</h2><p class="muted">علّم على اللي مش بتاكله، والوجبات المقترحة هتتعمل من غيره.</p>

function readOb(){const d=obDraft();const v=id=>{const e=document.getElementById(id);return e?e.value:null;};
  if(v("i_name")!==null)d.name=v("i_name").trim();
  if(v("i_age")!==null)d.age=v("i_age");if(v("i_h")!==null)d.h=v("i_h");if(v("i_w")!==null)d.w=v("i_w");if(v("i_waist")!==null)d.waist=v("i_waist");
  if(v("i_gym")!==null)d.gymTime=v("i_gym");if(v("i_wake")!==null)d.wake=v("i_wake");
  document.querySelectorAll("[data-mi]").forEach(e=>{d.meds[+e.dataset.mi][e.dataset.mk]=e.value;});
  const c=document.getElementById("i_clear");if(c)d.cleared=c.checked;}
function validOb(){const d=obDraft();
  if(obStep===0&&!(+d.age>=12&&+d.age<=90))return"اكتب سنك صح.";
  if(obStep===1&&!(+d.h>=130&&+d.h<=230&&+d.w>=35&&+d.w<=300))return"اكتب الطول بالسنتي والوزن بالكيلو.";
  if(obStep===2&&!d.goal)return"اختار هدف.";
  if(obStep===3&&d.level===null)return"اختار مستواك.";
  return"";}
function bindOb(){
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{readOb();const d=obDraft();let val=b.dataset.val;
    if(["days","session","level"].includes(b.dataset.f))val=+val;d[b.dataset.f]=val;
    if(b.dataset.f==="goal"&&val==="calis")d.place="none";render();});
  document.querySelectorAll("[data-nf]").forEach(c=>c.onchange=()=>{readOb();const d=obDraft();d.noFood=(d.noFood||[]).filter(x=>x!==c.dataset.nf);if(c.checked)d.noFood.push(c.dataset.nf);});
  document.querySelectorAll("[data-h]").forEach(c=>c.onchange=()=>{readOb();const d=obDraft();d.health=d.health.filter(x=>x!==c.dataset.h);if(c.checked)d.health.push(c.dataset.h);render();});
  const am=$("#addMed");if(am)am.onclick=()=>{readOb();obDraft().meds.push({n:"",t:"21:00"});render();};
  const bk=$("#obBack");if(bk)bk.onclick=()=>{readOb();obStep--;render();};
  $("#obNext").onclick=()=>{readOb();const e=validOb();if(e){$("#obErr").textContent=e;return;}
    if(obStep<OB_STEPS-1){obStep++;render();window.scrollTo(0,0);return;}
    const d=obDraft();d.age=+d.age;d.h=+d.h;d.w=+d.w;d.waist=d.waist?+d.waist:null;d.meds=(d.meds||[]).filter(m=>m.n.trim());
    if(d.age<18&&d.level>2)d.level=2;
    const first=!S.profile;S.profile=d;if(first||!S.start)S.start=new Date().toISOString();
    if(!S.log.weights.length)S.log.weights.push({d:todayKey(),w:d.w});
    draft=null;obStep=0;editing=false;view="today";save();render();window.scrollTo(0,0);};
}

/* ---------- today / day ---------- */
function dayHTML(di){
  const p=P(),key=planFor(di),ph=cyclePhase();
  const isToday=di===weekIdx();
  let h=`<div class="hero"><div class="day">${WEEK[di]}${isToday?" · النهارده":""} · أسبوع ${weekNo()}</div>`;
  if(!key){const c=cardio(p,false);
    h+=`<div class="what">${di===6?"راحة كاملة":"راحة نشطة"}</div></div>
    <div class="card"><b>النهارده:</b> ${di===6?"ريّح جسمك. تمشية خفيفة لو حابب.":c.txt}</div>
    <div class="hint">الراحة جزء من التمرين. العضل بيكبر وانت مرتاح، مش وانت بتتمرن.</div>`;return h;}
  const cal=key[0]==="C"&&CAL[key];
  h+=`<div class="what">${cal?CAL[key].n:GYM[key].n}</div><div class="muted">${ph.n} — ${ph.d}</div></div>`;
  if(capped(p))h+=`<div class="flag">التمرين متوسط الشدة لحد ما الدكتور يوافق. لو جالك ألم في الصدر أو دوخة أو نهجان غريب، وقّف فورًا.</div>`;
  h+=`<div class="block"><h3>إحماء — 8 لـ 10 دقايق</h3><p>عجلة أو مشي، وبعدها لف الدراعات وتحريك الرجل و15 سكوات بوزن الجسم.</p></div>
      <div class="block main"><h3>التمرين الأساسي</h3><p>دوس ✓ بعد كل مجموعة، ومؤقت الراحة هيشتغل لوحده.</p></div>`;
  const dk=todayKey(),logged=(S.log.w[dk]||{});
  const list=cal?CAL[key].x:GYM[key].x;const used=new Set();
  const mode=!cal&&GYM[key].m;
  if(mode){const note={power:"يوم قوة: أوزان تقيلة وعدات قليلة وراحة طويلة.","5x5":"ركّز على التكنيك، وسجّل الوزن كل مرة علشان تزوّد.",gvt:"أول تمرينين 10×10 بنفس الوزن. التمرين ده مرهق، فنام كويس وكُل كويس.",hit:"كل مجموعة لحد الفشل، فمفيش مجموعات كتير. الأهم الشدة مش العدد.",circuit:"اعمل التمارين ورا بعض كدورة واحدة، وكرّر الدورة 3 مرات."}[mode];h+=`<div class="hint">${note}</div>`;}
  list.forEach((raw,ix)=>{
    if(cal){const c=calDose(raw,p),id=raw+"_"+ix;const lg=logged[id]||[];
      h+=`<div class="ex">${figSVG(cpFig(raw,c.idx))}<div class="t"><div><div class="ar">${esc(c.it[0])}</div><div class="en">${esc(CP[raw].n)} · مستوى ${c.idx+1} من ${CP[raw].l.length}</div></div><div class="dose">${c.sets}×${c.reps}</div></div>
      <div class="meta">راحة 90 ثانية · لما تعمل كل المجموعات بالعدد الأعلى بتكنيك نضيف، اطلع للمستوى اللي بعده.</div>
      ${linkBtns(c.it[1])}${setsHTML(id,c.sets,lg,90,true,isToday)}
      <div class="lvlbtns"><button class="btn alt" data-pg="${raw}" data-dir="-1" ${c.first?"disabled":""}>صعبة؛ ارجع مستوى</button><button class="btn alt" data-pg="${raw}" data-dir="1" ${c.last?"disabled":""}>سهلة؛ المستوى اللي بعده</button></div></div>`;
    }else{const k=resolve(raw,p,used),e=EX[k],dz=dose(k,p,mode,ix);const lg=logged[k]||[];

      ${linkBtns(e[1])}${setsHTML(k,dz.sets,lg,dz.restS,e[2]==="h",isToday)}</div>`;}
  });

  return h;
}
function setsHTML(id,n,lg,restS,hold,editable){
  if(!editable)return"";
  let s=`<div class="sets">`;
  for(let i=0;i<n;i++){const v=lg[i]||{};
    s+=`<div class="set"><span class="i">${i+1}</span>
    ${hold?`<input type="number" inputmode="numeric" placeholder="ثواني/عدات" data-id="${id}" data-i="${i}" data-k="r" value="${esc(v.r||"")}" style="grid-column:span 2">`:
    `<input type="number" inputmode="decimal" placeholder="كجم" data-id="${id}" data-i="${i}" data-k="kg" value="${esc(v.kg||"")}"><input type="number" inputmode="numeric" placeholder="عدات" data-id="${id}" data-i="${i}" data-k="r" value="${esc(v.r||"")}">`}
    <button data-done="${id}" data-i="${i}" data-rest="${restS}" aria-pressed="${!!v.ok}" aria-label="خلّصت المجموعة">✓</button></div>`;}
  return s+`</div>`;
}
function lastLog(k,except){const ds=Object.keys(S.log.w).filter(d=>d!==except&&S.log.w[d][k]).sort();if(!ds.length)return"";
  const sets=S.log.w[ds[ds.length-1]][k].filter(x=>x&&(x.kg||x.r));if(!sets.length)return"";

  <tr><td>لحمة حمرا قليلة الدهن</td><td>130 جم</td></tr><tr><td>واي بروتين</td><td>سكوب وربع</td></tr></table></div>
  <h3>🍚 كارب — كل سطر ≈ 40 جم</h3><div class="tbl"><table>
  <tr><td>رز أو مكرونة مطبوخ</td><td>150 جم (كوباية)</td></tr><tr><td>عيش بلدي أو سن</td><td>رغيف إلا ربع</td></tr>
  <tr><td>شوفان</td><td>60 جم (6 معالق)</td></tr><tr><td>بطاطس أو بطاطا مسلوقة</td><td>200 جم</td></tr>
  <tr><td>فول مدمس</td><td>طبق كبير (250 جم)</td></tr><tr><td>فاكهة</td><td>موزة كبيرة، أو 2 تفاحة</td></tr></table></div>
  <h3>🫒 دهون — كل سطر ≈ 10 جم</h3><div class="tbl"><table>
  <tr><td>زيت زيتون</td><td>معلقة كبيرة</td></tr><tr><td>مكسرات</td><td>حفنة صغيرة (15 جم)</td></tr>
  <tr><td>زبدة فول سوداني</td><td>معلقة كبيرة</td></tr><tr><td>أفوكادو</td><td>ربع حباية كبيرة</td></tr></table></div>
  <p class="muted">والخضار والسلطة مفتوحين، كُل منهم براحتك.</p>
  ${tips.length?`<h2>مخصوص ليك</h2>${tips.map(t=>`<div class="card">${t}</div>`).join("")}`:""}
  <p class="muted small">حساباتك: الحرق الأساسي ${n.bmr} سعر، والاحتياج اليومي حوالي ${n.tdee} سعر.</p>`;}

/* ---------- sleep & water ---------- */
function vLife(){const p=P(),train=!!planFor(weekIdx()),sp=sleepPlan(p),L=waterL(p,train),cups=Math.ceil(L*4);
  const dk=todayKey(),got=S.log.water[dk]||0;
  const gymEnd=(toMin(p.gymTime)||1200)+(p.session||60);const gap=((sp.bed-gymEnd)%1440+1440)%1440;
  const tl=timeline(p,train);
  return `<h1>نومك ومية</h1>
  <div class="stats"><div class="stat"><div class="n">${sp.need}</div><div class="l">ساعات نوم</div></div>
  <div class="stat"><div class="n">${tm(sp.bed).replace(" ","")}</div><div class="l">تنام</div></div>
  <div class="stat"><div class="n">${L}</div><div class="l">لتر مية</div></div></div>
  ${gap<120?`<div class="flag">تمرينك بيخلص قبل النوم بأقل من ساعتين، وده ممكن يصعّب النوم. لو تقدر، قدّم التمرين شوية.</div>`:""}
  <h2>مية النهارده</h2><p class="muted">${got} من ${cups} كوباية (250 مل)</p>
  <div class="cups">${Array.from({length:cups},(_,i)=>`<button data-cup="${i+1}" aria-pressed="${i<got}" aria-label="كوباية ${i+1}">💧</button>`).join("")}</div>
  <h2>يومك ${train?"(يوم تمرين)":"(يوم راحة)"}</h2>
  <ul class="tl">${tl.map(x=>`<li class="${x[2]}"><span class="tm">${tm(x[3])}</span><span>${esc(x[1])}</span></li>`).join("")}</ul>
  <h2>نوم أحسن</h2>
  <div class="card">نام وصحى في نفس المعاد حتى في الإجازة. ده لوحده بيحسّن النوم والجوع والمزاج.</div>
  <div class="card">أوضة ضلمة وباردة شوية، والموبايل بعيد عن السرير.</div>
  <div class="card">لو بتشخّر جامد أو بتصحى مخنوق أو تعبان رغم إنك نمت كفاية، قول لدكتور. ده ممكن يبقى انقطاع نفس أثناء النوم، وبيأثر على القلب والوزن.</div>`;}

/* ---------- progress / me ---------- */
function chart(){const w=S.log.weights;if(w.length<2)return`<p class="muted">سجّل وزنك مرة في الأسبوع، الصبح بعد الحمام وقبل الأكل، والرسم هيظهر هنا.</p>`;
  const W=320,H=140,pad=24;const vals=w.map(x=>x.w);const mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
  const X=i=>pad+(W-2*pad)*i/(w.length-1),Y=v=>H-pad-(H-2*pad)*(v-mn)/(mx-mn||1);
  const pts=w.map((x,i)=>X(i)+","+Y(x.w)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم الوزن"><polyline fill="none" stroke="var(--plate)" stroke-width="3" points="${pts}"/>
  ${w.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.w)}" r="3.5" fill="var(--plate)"/>`).join("")}
  <text x="${W-pad}" y="14" font-size="11" fill="var(--muted)" text-anchor="end">${vals[0]} كجم</text>
  <text x="${pad}" y="14" font-size="11" fill="var(--muted)">${vals[vals.length-1]} كجم</text></svg>`;}
function vMe(){const p=P();
  return `<h1>تقدّمي</h1>
  <div class="card"><h3 style="margin-top:0">الوزن</h3>${chart()}
  <div class="row" style="margin-top:10px"><input type="number" id="nw" inputmode="decimal" placeholder="وزنك النهارده (كجم)"><button class="btn gold" id="addW" style="flex:0 0 auto">سجّل</button></div></div>
  <h2>سلّم المستويات</h2>
  <ul class="ladder">${LEVELS.map((l,i)=>`<li class="${i===p.level?"here":i<p.level?"done":""}"><span class="lv">${i}</span><div><b>${l.n}</b><div class="muted">${l.d}</div>${i===p.level&&i<4?`<div class="small">علشان تطلع: ${l.up}</div>`:""}</div></li>`).join("")}</ul>
  ${p.level<4?`<button class="btn alt full" id="lvUp" style="margin-top:10px">وصلت للمستوى اللي بعده ⬆</button>`:""}
  <div class="hint"><b>عن مستر أوليمبيا:</b> البطولة دي محتاجة جينات نادرة، وسنين طويلة مع كوتش ومتابعة طبية، وأغلب المتسابقين فيها بيستخدموا هرمونات ليها مخاطر حقيقية على القلب والكبد. التطبيق بيوصّلك لأعلى مستوى طبيعي، وده يكفي إنك تنافس في بطولات كمال أجسام طبيعية.</div>
  <h2>إعدادات</h2>
  <button class="btn alt full" id="edit">عدّل بياناتي وهدفي</button>
  <button class="btn alt full" id="restart" style="margin-top:8px">ابدأ دورة جديدة من أسبوع 1</button>
  <button class="btn alt full" id="wipe" style="margin-top:8px;color:var(--warn)">امسح كل بياناتي</button>
  <p class="muted small" style="margin-top:14px">سوبر فت مش بديل عن الدكتور. لو عندك أي مشكلة صحية، خد رأيه قبل ما تبدأ أو تغيّر في شدة التمرين.</p>
  <p class="muted small">تنزّله على موبايلك: افتح الصفحة في المتصفح، ومن القايمة اختار "إضافة إلى الشاشة الرئيسية".</p>`;}

/* ---------- bindings ---------- */
function bindView(){
  const ss=$("#schoolSel");if(ss)ss.onchange=()=>{S.profile.school=ss.value;save();render();};
  document.querySelectorAll("[data-mp]").forEach(b=>b.onclick=()=>{const k=b.dataset.mp;S.mealPick=S.mealPick||{};S.mealPick[k]=(S.mealPick[k]||0)+1;save();render();});
  document.querySelectorAll("[data-fm]").forEach(b=>b.onclick=()=>{foodMode=b.dataset.fm;render();});
  document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{selDay=+b.dataset.sd;render();});
  document.querySelectorAll(".set input").forEach(inp=>inp.onchange=()=>{const dk=todayKey();S.log.w[dk]=S.log.w[dk]||{};
    const a=S.log.w[dk][inp.dataset.id]=S.log.w[dk][inp.dataset.id]||[];const i=+inp.dataset.i;a[i]=a[i]||{};a[i][inp.dataset.k]=inp.value;save();});
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const dk=todayKey();S.log.w[dk]=S.log.w[dk]||{};
    const a=S.log.w[dk][b.dataset.done]=S.log.w[dk][b.dataset.done]||[];const i=+b.dataset.i;a[i]=a[i]||{};a[i].ok=!a[i].ok;
    b.setAttribute("aria-pressed",a[i].ok);save();if(a[i].ok)startTimer(+b.dataset.rest);});
  document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{const mv=b.dataset.pg,c=calDose(mv,P());
    S.prog[mv]=Math.max(0,Math.min(CP[mv].l.length-1,c.idx+(+b.dataset.dir)));save();render();});
  document.querySelectorAll("[data-cup]").forEach(b=>b.onclick=()=>{const dk=todayKey(),n=+b.dataset.cup;
    S.log.water[dk]=(S.log.water[dk]===n)?n-1:n;save();render();});
  const aw=$("#addW");if(aw)aw.onclick=()=>{const v=+$("#nw").value;if(!(v>30&&v<350))return;
    const dk=todayKey();S.log.weights=S.log.weights.filter(x=>x.d!==dk);S.log.weights.push({d:dk,w:v});S.log.weights.sort((a,b)=>a.d<b.d?-1:1);
    S.profile.w=v;save();render();};
  const lu=$("#lvUp");if(lu)lu.onclick=()=>{if(confirm("متأكد إنك حققت شرط المستوى اللي بعده؟")){S.profile.level++;S.start=new Date().toISOString();save();render();}};
  const ed=$("#edit");if(ed)ed.onclick=()=>{draft=JSON.parse(JSON.stringify(S.profile));obStep=0;editing=true;render();window.scrollTo(0,0);};
  const rs=$("#restart");if(rs)rs.onclick=()=>{if(confirm("هترجع لأسبوع 1 في الدورة. بياناتك هتفضل زي ما هي.")){S.start=new Date().toISOString();save();render();}};
  const wp=$("#wipe");if(wp)wp.onclick=()=>{if(confirm("هيتمسح كل حاجة: بياناتك وتمارينك ووزنك. متأكد؟")){S={profile:null,log:{w:{},weights:[],water:{},checks:{}},prog:{},start:null,updated:0};save();draft=null;obStep=0;render();}};
}
$("#bar").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;if(view==="week")selDay=weekIdx();render();window.scrollTo(0,0);});

/* ---------- rest timer ---------- */
let tLeft=0,tInt=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime);o.start();o.stop(actx.currentTime+.35);}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
function showT(){$("#tn").textContent=Math.floor(tLeft/60)+":"+String(tLeft%60).padStart(2,"0");}
function startTimer(s){tLeft=s;$("#timer").classList.add("on");showT();clearInterval(tInt);
  tInt=setInterval(()=>{tLeft--;showT();if(tLeft<=0){clearInterval(tInt);beep();$("#tn").textContent="يلا!";setTimeout(()=>$("#timer").classList.remove("on"),2500);}},1000);}
$("#tplus").onclick=()=>{tLeft+=15;showT();};
$("#tskip").onclick=()=>{clearInterval(tInt);$("#timer").classList.remove("on");};

render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
